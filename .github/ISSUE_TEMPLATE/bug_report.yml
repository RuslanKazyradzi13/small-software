name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security issue? Please report it privately instead — see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and its output. Remove tokens, keys and sign-in links.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: small version
      description: Output of `small --version`
      placeholder: small 0.5.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: dropdown
    id: template
    attributes:
      label: App template
      options: [python-http, fastapi, node-http, streamlit, my own code]
