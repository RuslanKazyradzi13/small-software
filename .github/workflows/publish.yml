name: publish

# Publish small-software to PyPI when a GitHub release is published. No tokens: PyPI trusts this workflow
# (Trusted Publishing, https://docs.pypi.org/trusted-publishers/). A manual run only builds the package.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: The version in pyproject.toml matches the release tag
        if: github.event_name == 'release'
        working-directory: small-cli
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$TAG" || { echo "pyproject.toml: $version, tag: $TAG"; exit 1; }
      - name: sdist and wheel
        working-directory: small-cli
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: small-cli/dist/

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/small-software
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
