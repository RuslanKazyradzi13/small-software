name: tests

on:
  push:
  pull_request:

env:
  PYTHONIOENCODING: utf-8  # иначе на Windows русский текст в логах превращается в ??

jobs:
  small-cli:
    name: small-cli · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: windows-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7  # для теста шаблона node-http
        with:
          node-version: "20"
      - name: Тесты (без Streamlit и FastAPI — их тесты пропускаются)
        working-directory: small-cli
        run: python -m unittest discover -s tests -v

  framework-templates:
    name: small-cli · шаблоны streamlit и fastapi на настоящих фреймворках
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "streamlit>=1.40,<2" "fastapi>=0.110,<1" "uvicorn>=0.29,<1" httpx
      - name: Тесты шаблонов streamlit и fastapi
        working-directory: small-cli
        run: python -m unittest discover -s tests -k StreamlitTemplateTest -k FastAPITemplateTest -v

  magic-link:
    name: magic-link · Python + Node.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Python (WSGI)
        working-directory: magic-link
        run: python -m unittest test_magic_link -v
      - name: Node.js
        working-directory: magic-link
        run: node --test
