[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "small-software"
version = "0.7.0"
description = "A cloud for small software: deploy team apps to Railway in one command, private by default, shared by work email"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "RuslanKazyradzi13"}]
keywords = ["railway", "deploy", "internal-tools", "magic-link", "email-login", "passwordless", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/RuslanKazyradzi13/small-software"
Documentation = "https://github.com/RuslanKazyradzi13/small-software/blob/main/small-cli/README.md"
Changelog = "https://github.com/RuslanKazyradzi13/small-software/blob/main/small-cli/CHANGELOG.md"
Issues = "https://github.com/RuslanKazyradzi13/small-software/issues"
Source = "https://github.com/RuslanKazyradzi13/small-software"

[project.scripts]
small = "small_cli.cli:main"

[tool.setuptools]
packages = ["small_cli", "small_cli.commands"]

[tool.setuptools.package-data]
small_cli = ["templates/*/*"]

[tool.setuptools.exclude-package-data]
small_cli = ["templates/*/__pycache__", "templates/*/__pycache__/*", "templates/*/*.pyc"]
