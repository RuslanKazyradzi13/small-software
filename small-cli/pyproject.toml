[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "small-cli"
version = "0.1.0"
description = "small deploy — деплой папки с кодом в Railway одной командой"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
small = "small_cli.cli:main"

[tool.setuptools]
packages = ["small_cli"]

[tool.setuptools.package-data]
small_cli = ["templates/*/*"]
